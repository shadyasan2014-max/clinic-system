<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة العيادات والحجوزات - د. بهاء شكري</title>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #0f4c5c;
    --primary-hover: #0a3641;
    --accent-gold: #d97706;
    --accent-lime: #84cc16;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #1e293b;
    --border: #cbd5e1;
    --success: #16a34a;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
  body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
  .container { max-width: 1180px; margin: 0 auto; }
  
  header { background: var(--primary); color: white; padding: 18px 24px; border-radius: 14px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 12px rgba(15, 76, 92, 0.15); border-bottom: 3px solid var(--accent-lime); }
  .brand-logo { display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; cursor: pointer; transition: opacity 0.2s; }
  .brand-logo:hover { opacity: 0.9; }
  .logo-box { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--accent-lime); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .logo-box img { width: 100%; height: 100%; object-fit: cover; }
  .header-text h1 { font-size: 1.4rem; margin-bottom: 2px; color: #ffffff; }
  .header-text p { font-size: 0.88rem; color: var(--accent-lime); font-weight: 500; }
  
  .card { background: var(--card-bg); border-radius: 12px; padding: 24px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 2px 5px rgba(0,0,0,0.04); }
  .card-title { font-size: 1.15rem; font-weight: bold; color: var(--primary); margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.88rem; font-weight: 600; color: #334155; }
  .field input, .field select, .field textarea { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
  
  .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .btn:hover { background: var(--primary-hover); }
  .btn-success { background: var(--success); }
  .btn-secondary { background: #475569; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 12px; text-align: right; }
  th, td { padding: 12px 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.92rem; }
  th { background-color: #f1f5f9; color: var(--primary); }
  
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
  .modal-content { background: white; padding: 26px; border-radius: 14px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; }
  
  .files-preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .file-item-card { display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; }
  .file-item-card img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
  .remove-btn { color: var(--danger); background: none; border: none; font-size: 1.1rem; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
  <header>
    <a href="index.html" class="brand-logo" title="الرجوع للبوابة الرئيسية">
      <div class="logo-box">
        <img src="Logo.png" alt="Logo" onerror="this.src='logo.png'; this.onerror=null;">
      </div>
      <div class="header-text">
        <h1>د. بهاء شكري - Dr. Bahaa Shoukry</h1>
        <p>نظام إدارة حجوزات العيادات</p>
      </div>
    </a>
    <button class="btn btn-secondary" onclick="toggleClinicManager()">⚙️ إدارة الفروع والعيادات</button>
  </header>

  <!-- Add New Appointment Form -->
  <div class="card">
    <div class="card-title" id="bookingFormTitle">➕ إضافة حجز مريض جديد</div>
    <input type="hidden" id="editingDbId" value="-1">
    
    <div class="grid">
      <div class="field">
        <label>نوع الزيارة</label>
        <select id="bookingVisitType" onchange="toggleBookingVisitFields()">
          <option value="كشف جديد">كشف جديد</option>
          <option value="متابعة">متابعة (بعد العملية)</option>
          <option value="أخرى">أخرى</option>
        </select>
      </div>

      <!-- حقل الكود يظهر دائماً -->
      <div class="field" id="bookingPatientCodeBox">
        <label style="color: var(--primary); font-weight: bold;">🔑 كود المريض:</label>
        <input type="text" id="bookingPatientCode" placeholder="مثال: C-101" onchange="fetchPatientDetailsFromPreOp('booking')">
      </div>

      <div class="field"><label>اسم المريض بالكامل</label><input type="text" id="patientName"></div>
      <div class="field"><label>رقم التليفون 1</label><input type="tel" id="patientPhone1"></div>
    </div>

    <button class="btn" style="width: 100%;" onclick="addOrUpdateAppointment()">💾 حفظ الحجز أونلاين</button>
  </div>
</div>

<!-- Modal -->
<div id="checkInModal" class="modal">
  <div class="modal-content">
    <div class="field" id="modalPatientCodeBox">
        <label style="color: var(--primary); font-weight: bold;">🔑 كود المريض:</label>
        <input type="text" id="modalPatientCode" onchange="fetchPatientDetailsFromPreOp('modal')">
    </div>
    <!-- ... (باقي محتوى الـ Modal كما هو) -->
    <div class="field" style="margin-top: 16px;">
      <label>📎 إرفاق ملفات (صور / PDF / Word):</label>
      <input type="file" id="visitPaperFiles" multiple onchange="handleVisitFiles(this)">
      <div id="modalFilesPreview" class="files-preview-container"></div>
    </div>
    <button class="btn btn-success" style="width: 100%;" onclick="confirmCheckIn()">💾 حفظ وتأكيد</button>
  </div>
</div>

<script>
  // ... (نفس السكريبت الخاص بك مع التعديل التالي)

  function toggleBookingVisitFields() {
    let type = document.getElementById('bookingVisitType').value;
    document.getElementById('otherTypeBox').style.display = (type === 'أخرى') ? 'flex' : 'none';
    document.getElementById('bookingSurgeryDateBox').style.display = (type === 'متابعة') ? 'flex' : 'none';
    // لا نخفي حقل الكود، نتركه يظهر دائماً
    document.getElementById('bookingPatientCodeBox').style.display = 'flex';
  }

  function toggleModalFollowUpFields() {
    let type = document.getElementById('modalVisitType').value;
    let isFollowUp = (type === 'متابعة');
    document.getElementById('modalFollowUpFields').style.display = isFollowUp ? 'block' : 'none';
    // يظهر دائماً
    document.getElementById('modalPatientCodeBox').style.display = 'flex';
  }

  window.onload = function() {
    renderClinicsOptions();
    fetchAppointmentsFromSupabase();
    toggleBookingVisitFields(); // لتفعيل الإظهار عند التحميل
  };
</script>
</body>
</html>
